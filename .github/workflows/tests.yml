name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10.*'
            pest: '4.*'
            pest-plugin: '4.*'
          - laravel: '13'
            testbench: '11.*'
            pest: '4.*'
            pest-plugin: '4.*'
          - php: '8.2'
            laravel: '12'
            testbench: '10.*'
            pest: '3.*'
            pest-plugin: '3.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, curl, sqlite, pdo_sqlite
          coverage: none
      - name: Validate package manifest
        run: composer validate --strict
      - name: Install compatible dependencies
        run: >-
          composer update --prefer-dist --no-interaction --no-progress
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --with "pestphp/pest:${{ matrix.pest }}"
          --with "pestphp/pest-plugin-laravel:${{ matrix.pest-plugin }}"
      - name: Execute tests
        run: composer test -- --no-coverage
