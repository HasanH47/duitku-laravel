name: Duitku Upstream Watch

on:
  schedule:
    - cron: '15 2 * * 1' # Monday 09:15 Asia/Jakarta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duitku-upstream-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, dom, mbstring
          coverage: none
      - name: Install monitoring dependencies
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress
      - name: Check official documentation and SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: php tools/monitor-upstream.php
      - name: Publish run summary
        run: cat build/upstream/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash tools/notify-upstream.sh
      - name: Upload comparison report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duitku-upstream-report
          path: build/upstream/
          retention-days: 30
